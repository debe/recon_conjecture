# Publish the canvas page with a fresh ledger snapshot on every push to main.
# Two jobs, as in GitHub's starter workflow: deploy-pages looks the artifact up through the
# API, and within the uploading job that lookup can race the upload and fail intermittently.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # deploy-pages looks up the build job's artifact
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the ledger (steps, programs, leases, event tail)
        env:
          RECON_LIVE: "off"
        run: python3 tools/snapshot.py --out site/state.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  announce:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tell the live view (merged)
        env:
          RECON_LIVE_TOKEN: ${{ secrets.RECON_LIVE_TOKEN }}
        run: |
          [ -n "$RECON_LIVE_TOKEN" ] || exit 0
          python3 tools/live.py emit merged --actor ci \
            --data "{\"sha\": \"$GITHUB_SHA\", \"url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\"}"
