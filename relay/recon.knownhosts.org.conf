# nginx vhost for the recon-relay (deimos). Installed as
# /etc/nginx/sites-enabled/recon.knownhosts.org.conf by relay/deploy.sh.

limit_req_zone $binary_remote_addr zone=recon_post:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=recon_conn:1m;

server {
    listen      80;
    listen [::]:80;
    server_name recon.knownhosts.org;

    # certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name recon.knownhosts.org;

    ssl_certificate     /etc/letsencrypt/live/recon.knownhosts.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recon.knownhosts.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Off deliberately: bearer tokens travel in a header, and the relay logs rejections itself.
    access_log off;
    client_max_body_size 16k;

    location = /events {
        limit_req zone=recon_post burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Server-Sent Events: no buffering, long-lived connections.
    location = /stream {
        limit_conn recon_conn 8;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /recent { proxy_pass http://127.0.0.1:8090; }
    location = /health { proxy_pass http://127.0.0.1:8090; }
    location / { return 404; }
}
