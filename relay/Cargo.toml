[package]
name = "recon-relay"
version = "0.1.0"
edition = "2024"
description = "Live-event relay for the recon_conjecture fleet: token-authenticated POST, SSE fan-out"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
